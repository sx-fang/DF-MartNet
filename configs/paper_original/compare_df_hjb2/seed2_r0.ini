[Example]
name = HJB3a
dim_x = 10001
s_range = 1.0
repeat_time = 1
save_result_for_every_repeat_time = True
m_rc = 1024
m_mc = 1000000
num_test_points = 1000

[Training]
dt = 1/100
max_iter = 10000
num_xpts_batch = 64
num_pilot_paths = 10000
rc_loggap = 500
num_descent = 2
num_ascent = 1
w_term_v = 1.0
lam0 = 10
delta4 = 10
lam_bar = 1000

[Network]
width_v = 10010
width_u = 10010
width_rho = 600
num_hidden_v = 6
num_hidden_u = 6
num_hidden_rho = 0
act_v = ReLU
act_u = ReLU
act_rho = LeakyReLU
bias_uniform = True
rho_shell = sin
scale_lb_rho = 1.0
scale_ub_rho = 100.0

[Optimizer]
optimizer = RMSprop
kwargs = {}
lr0_v = 3.7857433e-06
lr0_u = 3.7857433e-06
lr0_rho = 3.7857433e-05
decay_stepgap = 100
decay_rate = 1e-2**(${decay_stepgap}/10000)

[Environment]
output_dir = ./results/native
seed = 2
torch_dtype = float32
enable_autocast = False
enable_scaler = False
