

[Example]
name = HJBSparseLQK1
dim_x = 10001
repeat_time = 1
save_result_for_every_repeat_time = True
M_rc = 4096
num_test_points = 320
sparse_c = 1.0
sparse_a = 1.0
sparse_omega = 1.0
sparse_delta = 1.0
sparse_m = 20

x0_point_origin = True

[Training]
dt = 1/32
max_iter = 12000
num_xpts_batch = 6400
num_pilot_paths = 10240
rc_loggap = 500
num_descent = 2
num_ascent = 1
noise_sampler = amc
u_fixed_ref = False
ema_robust = True
rho_clip = False
w_term_v = 1.0
w_term_u = 1.0

[Network]
width_v = 10010
width_u = 10010
width_rho = 600
num_hidden_v = 4
num_hidden_u = 4
num_hidden_rho = 0
act_v = ReLU
act_u = ReLU
act_rho = LeakyReLU
bias_uniform = True
rho_shell = sin
scale_lb_rho = 1.0
scale_ub_rho = 100.0

[Optimizer]
optimizer = RMSprop
kwargs = {}
lr0_v = 3 * 3 * 1e-3 / 10000**0.8
lr0_u = 3 * 1e-3 / 10000**0.8
lr0_rho = 3 * 1e-2 / 10000**0.8
decay_stepgap = 100
decay_rate = 1e-2**(${decay_stepgap} / ${Training:max_iter})

[Environment]
output_dir = ./results/native
seed = 1
torch_dtype = float32
enable_autocast = True
autocast_dtype = bfloat16
enable_scaler = True
save_weights = auto
